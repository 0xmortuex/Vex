# Build Vex for Android, for real.
#
# The desktop checks run on Windows; this one exists because the Android half
# cannot be built where it is written — Google's Maven is not always reachable,
# and an SDK is a large thing to assume. A GitHub runner has both, so this is
# the first place the app is actually assembled, and it leaves a debug APK you
# can install behind every push.
name: Verify Vex for Android

on:
  push:
    paths:
      - 'mobile/**'
      - 'tests/mobile/**'
      - 'src/renderer/css/theme-tokens.css'
      - 'src/renderer/js/sync-crypto.js'
      - 'src/renderer/js/sync-records.js'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'tests/mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the chrome's dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      # The checks that do not need a device: the chrome parses, every native
      # call the bridge makes exists, the themes and the shared sync files have
      # not drifted from the desktop's, and the Java type-checks.
      - name: Check
        working-directory: mobile
        run: npm run check

      # Playwright's Chromium is ~300 MB and the same for every run on a given
      # Playwright version; downloading it each time costs more than the smoke
      # run itself.
      - name: Playwright's Chromium, cached
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json') }}

      - name: Drive the chrome in a phone-sized Chromium
        working-directory: mobile
        run: |
          npx playwright install --with-deps chromium
          npm run smoke

      # Run from mobile/ so building the Android app never waits on the
      # desktop's Electron download.
      - name: The chrome's unit tests
        working-directory: mobile
        run: npm test

      # The runner image already carries an Android SDK and command-line tools;
      # android-actions/setup-android only added the long-obsolete "tools"
      # package to it, which the repository no longer serves — so the action
      # failed before Gradle was ever reached. Use the SDK that is there and add
      # only the two packages Vex builds against.
      - name: Android platform and build tools
        run: |
          set -euo pipefail
          sdkmanager=$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Copy the chrome into the app
        working-directory: mobile
        run: npx cap sync android

      # AGP, the androidx libraries and the Gradle distribution itself are the
      # same on every run; only the sources change.
      - name: Gradle's caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # The wrapper is in git, and it is the only Gradle that may build this: the
      # runner's own is 9.8, and AGP 8.x reaches for a Gradle internal API that
      # 9.6 removed — `gradle wrapper` alone was enough to fail, because any task
      # configures :app first.
      - name: Assemble the debug APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Lint the Android sources
        working-directory: mobile/android
        run: ./gradlew --no-daemon lintDebug
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: vex-android-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
