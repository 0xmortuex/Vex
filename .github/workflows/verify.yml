name: Verify Vex
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    # The whole sequence now takes about an hour: the full tests (~9 min), check:ui
    # (~30 min with every look and settings layout), the smoke matrix and the package.
    timeout-minutes: 90
    steps:
      # Actions are pinned to the full commit of a release tag, so a moved or hijacked tag cannot change what runs here.
      # To update one: gh api repos/<owner>/<repo>/git/ref/tags/<tag> (dereference an annotated tag), check the commit exists, change both the SHA and the comment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:source
      - run: npm run check:types
      - run: npm run lint
      - run: npm test -- --maxWorkers=4
      - run: npm run smoke
      - run: npm run smoke:restart
      - run: npm run smoke
        env:
          VEX_SECURITY_SMOKE: '1'
          VEX_UI_SMOKE: '1'
      # Real rendered chrome in every look and a sample of themes (~30 s
      # locally). The runner has a desktop, which the UI smoke above needs too.
      - run: npm run check:ui
      # Integration smoke matrix (T0-003): the first 40 catalogue items in the Full,
      # Simple and Minimal tiers, firefox look. The whole matrix (all looks, all
      # items) stays a manual `npm run smoke:matrix -- --tiers=full,simple,minimal`.
      - run: npm run smoke:matrix:ci
      - run: node scripts/build-icons.js scratchpad/ci-icons
      - run: npm audit --omit=dev --audit-level=high
      # The build tools: like `npm audit --audit-level=high`, but with the
      # exceptions listed (and checked) in scripts/audit-dev.js.
      - run: node scripts/audit-dev.js
        if: github.event_name == 'schedule'
      - run: npm run pack -- --config.directories.output=scratchpad/ci-package
        env:
          VEX_SKIP_VMP_VERIFY: '1'
          VEX_FUSES: '1'
      # Fuses are opt-in (release builds leave them off, see RELEASING.md); CI builds with them (VEX_FUSES) and checks them:
      # the packaged app must carry the Electron fuses scripts/lib/fuse-config.js asks for, its asar must match the integrity
      # record in Vex.exe, and the vendored third-party files must be the ones recorded in scripts/vendor-manifest.json.
      - run: node scripts/verify-fuses.js scratchpad/ci-package/win-unpacked
        env:
          VEX_FUSES: '1'
      - run: node scripts/vendor-manifest.js --check --asar scratchpad/ci-package/win-unpacked/resources/app.asar
      # A CycloneDX bill of materials from package-lock.json (no network); fails if the lockfile can no longer be described.
      - run: node scripts/gen-sbom.js --check
      - run: npm run smoke
        env:
          VEX_SMOKE_EXECUTABLE: scratchpad/ci-package/win-unpacked/Vex.exe
          VEX_SECURITY_SMOKE: '1'
          VEX_UI_SMOKE: '1'
