ext {
    // Kept in step with @capacitor/android 8.x — Capacitor's own library builds
    // against these, and a lower compileSdk here fails the manifest merge.
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    androidxWebkitVersion = '1.14.0'
    androidxSwipeRefreshVersion = '1.1.0'
    // 1.1.0 is the newest STABLE biometric; everything after it is alpha, and
    // 1.4.0 does not exist at all — Gradle said so, having searched for it.
    // BiometricPrompt, PromptInfo and Authenticators are all here.
    androidxBiometricVersion = '1.1.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
    // On-device AI. Both live on Google's Maven, which is unreachable from the
    // machine this is written on, so these start as dynamic versions: the first
    // CI build prints what they resolved to (see the "On-device AI versions"
    // step) and they get pinned to it. A guessed version is how
    // androidx.biometric:1.4.0 — which does not exist — reached a build.
    litertLmVersion = 'latest.release'
    mlkitGenAiVersion = 'latest.release'
}
