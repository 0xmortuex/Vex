<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="darkreader-lock">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unlock Vex</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f4ef; --fg: #1d1b16; --muted: #6b665a; --line: #cfc9ba; --accent: #1f5f8b; --bad: #a4262c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1a1916; --fg: #ece8dc; --muted: #a39d8c; --line: #3b382f; --accent: #6bb0dd; --bad: #ff8a8f; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  main { max-width: 380px; margin: 0 auto; padding: 28px 24px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { margin: 0 0 14px; color: var(--muted); }
  label { display: block; margin: 0 0 4px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--fg); font: inherit; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  button { padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--fg); font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-primary, #fff); }
  button:disabled { opacity: .55; cursor: default; }
  #msg { min-height: 20px; margin-top: 12px; color: var(--bad); }
  .link { border: 0; padding: 0; color: var(--accent); text-decoration: underline; }
</style>
</head>
<body>
<main>
  <h1>Unlock Vex</h1>
  <p id="intro">Your profile is encrypted. Type your passphrase to open it.</p>
  <form id="form" autocomplete="off">
    <label for="secret" id="label">Passphrase</label>
    <input id="secret" type="password" spellcheck="false" autocomplete="off" required>
    <div class="row">
      <button class="primary" type="submit" id="go">Unlock</button>
      <button type="button" id="quit">Quit</button>
    </div>
    <p style="margin-top:14px"><button type="button" class="link" id="switch">Use the recovery code instead</button></p>
    <div id="msg" role="alert" aria-live="polite"></div>
  </form>
</main>
<script src="profile-unlock.js"></script>
</body>
</html>
