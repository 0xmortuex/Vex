name = "vex-sync"
main = "worker.js"
compatibility_date = "2024-01-01"

# Legacy namespaces are read during migration to VEX_STATE durable storage.
# Existing deployments must retain their own original IDs. New deployments may
# remove this block, or provision their own namespaces:
#   wrangler kv namespace create VEX_SYNC_KV
#   wrangler kv namespace create VEX_AUTH_KV
# Production email delivery requires RESEND_API_KEY; see SELF_HOSTING.md.
# Every deployment also requires EMAIL_HASH_SECRET (32+ random characters):
# accounts are keyed by an HMAC of the address with it. Without it the
# worker refuses every request. Set it once and never change it (a new value
# loses every account keyed with the old one):
#   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))" | npx wrangler secret put EMAIL_HASH_SECRET
kv_namespaces = [
  { binding = "VEX_SYNC_KV", id = "40c0bad652014244a39befef24c28b32" },
  { binding = "VEX_AUTH_KV", id = "2ad5d370a6ad477ab1e95285f5fc671d" }
]

# VEX_STATE: one global object for sign-in codes, rate limits and which
# account each session token belongs to. It also keeps every account exactly
# as workers up to v2.37.0 stored it; each account is copied out of it on its
# first request after the upgrade (see SELF_HOSTING.md, "Upgrading").
[[durable_objects.bindings]]
name = "VEX_STATE"
class_name = "VexSyncState"

# VEX_ACCOUNTS: one object per account (idFromName of the account's HMAC key).
[[durable_objects.bindings]]
name = "VEX_ACCOUNTS"
class_name = "VexSyncAccount"

# Never edit or remove an applied migration; add a new tag below instead.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["VexSyncState"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["VexSyncAccount"]
